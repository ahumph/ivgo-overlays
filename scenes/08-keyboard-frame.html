<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>IVGO · 08 Keyboard Frame</title>
<meta name="viewport" content="width=1920"/>
<style>
  html,body{margin:0;padding:0;background:transparent;width:1920px;height:1080px;overflow:hidden}
  /* Chamfered outline that visually matches the info panel.
     Built as two layers:
       1. an SVG polygon stroke for the outline (so the diagonal cuts are stroked,
          not gapped like a CSS border + clip-path combo would leave them);
       2. a thin accent shadow at the very top to mirror the info panel's
          `boxShadow: inset 0 1px 0 0 rgba(40,154,230,.18)`.
     Inside is fully transparent so the window-capture source below (Pianoteq)
     shows through. */
  .frame-wrap {
    position:absolute;
    /* Right edge = chat left edge − 10px gap (chat at right:24, rendered width 374,
       so chat left edge at viewport x=1522; frame right edge at 1512; with
       width 1260, frame left edge at 252). */
    left:252px;
    bottom:46px;
    width:1260px;
    height:192px;
  }
  .frame-wrap svg { display:block; width:100%; height:100%; }
  /* Top accent — a 1px tinted bar inset 1px from the top to live just inside
     the stroked polygon. Clip-path matches the polygon so the ends taper into
     the chamfer instead of poking out into the cut corner. */
  .frame-accent {
    position:absolute;
    left:0; right:0; top:1px; height:1px;
    background: rgba(40,154,230,.28);
    clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 0);
    pointer-events:none;
  }
</style>
</head>
<body>
  <div class="frame-wrap">
    <svg viewBox="0 0 1260 192" preserveAspectRatio="none" aria-hidden="true">
      <polygon
        points="10,0.5 1259.5,0.5 1259.5,181.5 1249.5,191.5 0.5,191.5 0.5,10"
        fill="none"
        stroke="rgba(255,255,255,0.18)"
        stroke-width="1"
      />
    </svg>
    <div class="frame-accent"></div>
  </div>
</body>
</html>
