<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>IVGO · 03 Camera Chat</title>
<meta name="viewport" content="width=1920"/>
<style>
  html,body{margin:0;padding:0;background:transparent;width:1920px;height:1080px;overflow:hidden}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../phoenix.min.js"></script>
<script src="../ivgo-shared.js"></script>

<script>
(function () {
  const { ChatPanel } = window.IVGO;
  const e = React.createElement;

  // 03-camera.html's cam frame is centred at x:320..1600 (1280px wide on a
  // 1920 canvas) - width:310 here, not the 340 the other chat variants use,
  // lands this panel's left edge exactly on that frame's right edge (1920 -
  // 10 - 310 = 1600) instead of clipping 30px into the host's video.
  function Chat() {
    return e('div', { style:{position:'absolute',inset:0} },
      e(ChatPanel, { style: { position:'absolute', right:10, top:540, width:310, bottom:36+10 } })
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(Chat));
})();
</script>
</body>
</html>
