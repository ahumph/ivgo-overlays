<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>IVGO · 01 Starting Soon</title>
<meta name="viewport" content="width=1920"/>
<style>
  html,body{margin:0;padding:0;background:transparent;width:1920px;height:1080px;overflow:hidden}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../phoenix.min.js"></script>
<script src="../ivgo-shared.js"></script>

<script>
(function () {
  const { Scene, HeaderBar, AudioBars, Ticker, T, TICKER } = window.IVGO;
  const e = React.createElement;

  function SceneStartingSoon() {
    // Countdown — defaults to 4:32, override with ?mins=10&secs=00 or ?target=ISO8601
    const params = new URLSearchParams(location.search);
    const initial = (() => {
      if (params.get('target')) {
        const dt = new Date(params.get('target')).getTime();
        const diff = Math.max(0, Math.floor((dt - Date.now())/1000));
        return { m: Math.floor(diff/60), s: diff%60 };
      }
      return {
        m: parseInt(params.get('mins') ?? '4', 10),
        s: parseInt(params.get('secs') ?? '32', 10),
      };
    })();

    const [t, setT] = React.useState(initial);
    React.useEffect(() => {
      const id = setInterval(() => {
        setT(p => {
          let s = p.s - 1, m = p.m;
          if (s < 0) { s = 59; m = Math.max(0, m - 1); }
          if (m === 0 && s === 0) clearInterval(id);
          return { m, s };
        });
      }, 1000);
      return () => clearInterval(id);
    }, []);

    const mm = String(t.m).padStart(2,'0');
    const ss = String(t.s).padStart(2,'0');

    return e(Scene, { label: '01 Starting Soon', transparent: true },
      // Background video is now an OBS Media Source ("IVGO: Starting Soon Video")
      // layered beneath this browser source — gives OBS-level playback control
      // (volume, restart, pause, hotkeys) instead of HTML <video>.
      // Dim wash kept here so chrome stays readable on top of the busy video.
      e('div', { style:{
        position:'absolute', inset:0, zIndex:1, pointerEvents:'none',
        background:'linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.65) 100%)'
      }}),
      e(HeaderBar),
      // Top block — logo + IRISH caption pinned near the top so the centre
      // of the video stays visible.
      e('div', { className:'ovl-anim-rise', style:{
        position:'absolute', top:94, left:0, right:0, textAlign:'center', zIndex:2
      }},
        e('img', { src:'../brand-assets/IVGO_w.png', alt:'IVGO',
          style:{ height:120, display:'block', margin:'0 auto 24px', filter:`drop-shadow(0 0 18px ${T.accentGlow})` } }),
        e('div', { style:{fontFamily:T.mono,fontSize:13,letterSpacing:'.42em',color:T.accent,textTransform:'uppercase',textShadow:`0 0 12px ${T.accentGlow}`} }, 'IRISH VIDEO GAME ORCHESTRA')
      ),
      // Bottom block — title + countdown pinned just above the bars so the
      // middle of the canvas is empty for the background video to read.
      e('div', { className:'ovl-anim-rise', style:{
        position:'absolute', bottom:36+80+24, left:0, right:0, textAlign:'center', zIndex:2,
        display:'flex', flexDirection:'column', alignItems:'center', gap:20
      }},
        e('div', { style:{fontFamily:T.display,fontSize:140,fontWeight:900,lineHeight:.92,letterSpacing:'-.01em'} }, 'STARTING', e('br'), 'SOON'),
        e('div', { className:'ovl-chamfer', style:{
          background:T.bg2, border:`1px solid ${T.rule2}`,
          padding:'18px 36px', display:'inline-flex', alignItems:'center', gap:30
        }},
          e('div', { style:{fontFamily:T.mono,fontSize:11,letterSpacing:'.28em',color:T.ink2} }, 'STARTING IN'),
          e('div', { style:{display:'flex',alignItems:'baseline',gap:6,fontFamily:T.display,fontWeight:800} },
            e('span', { style:{fontSize:64} }, mm),
            e('span', { className:'ovl-blink', style:{fontSize:36,color:T.ink3} }, ':'),
            e('span', { style:{fontSize:64} }, ss)
          ),
          e('div', { style:{height:36,width:1,background:T.rule2} }),
          e('div', { style:{display:'flex',flexDirection:'column',gap:4} },
            e('div', { style:{fontFamily:T.mono,fontSize:10,letterSpacing:'.24em',color:T.ink3} }, 'NEXT CONCERT'),
            e('div', { style:{fontFamily:T.display,fontSize:18,fontWeight:700,letterSpacing:'.05em'} }, '01.08.2026 · HELIX DUBLIN')
          )
        )
      ),
      // Bars: full-width strip sitting directly on top of the ticker chrome
      // (ticker is bottom:0 height:36, so bars sit at bottom:36, height:36).
      e('div', { style:{position:'absolute', left:0, right:0, bottom:36, height:80, zIndex:5} },
        e(AudioBars, { count: 48, height: 80, color: T.accent, speed: 1.6 })
      ),
      e(Ticker, { items: TICKER.startingSoon })
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(SceneStartingSoon));
})();
</script>
</body>
</html>
