<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>IVGO · 04 Be Right Back</title>
<meta name="viewport" content="width=1920"/>
<style>
  html,body{margin:0;padding:0;background:transparent;width:1920px;height:1080px;overflow:hidden}
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../phoenix.min.js"></script>
<script src="../ivgo-shared.js"></script>

<script>
(function () {
  const { Scene, HeaderBar, AudioBars, Ticker, T, TICKER } = window.IVGO;
  const e = React.createElement;

  function SceneBRB() {
    return e(Scene, { label: '04 Be Right Back' },
      e(HeaderBar),
      // Text block — pinned to the top half of the canvas so the video below
      // it can rise up unblocked.
      e('div', { className: 'ovl-anim-rise', style: {
        position:'absolute', top:94, left:0, right:0, textAlign:'center', zIndex:3
      }},
        e('img', { src:'../brand-assets/IVGO_w.png', alt:'IVGO',
          style:{ height:80, display:'block', margin:'0 auto 14px', filter:`drop-shadow(0 0 18px ${T.accentGlow})` } }),
        e('div', { style:{fontFamily:T.mono,fontSize:13,letterSpacing:'.42em',color:T.accent,textTransform:'uppercase',marginBottom:14,textShadow:`0 0 12px ${T.accentGlow}`} }, 'IRISH VIDEO GAME ORCHESTRA'),
        e('div', { style:{fontFamily:T.display,fontSize:64,fontWeight:900,lineHeight:.92,letterSpacing:'-.01em'} }, 'BE RIGHT BACK.')
      ),
      // About-us video. Anchored to the very bottom of the viewport with
      // zIndex:1 so the audio bars (zIndex:5) and the ticker overlay its
      // lower edge — the video appears to rise up out of the bars without
      // a visible bottom line. objectFit:cover crops the hidden portion.
      e('video', {
        src: '../media/about.mkv',
        autoPlay: true, loop: true, playsInline: true,
        className: 'ovl-chamfer',
        style: {
          position: 'absolute', left: '50%', bottom: 0,
          transform: 'translateX(-50%)',
          width: 1200, height: 675, display: 'block',
          border: `1px solid ${T.rule2}`,
          boxShadow: `0 8px 40px rgba(0,0,0,.6)`,
          background: '#000', objectFit: 'cover', zIndex: 1
        }
      }),
      // Full-width bars on top of the ticker chrome — matches 01 Starting Soon.
      e('div', { style:{position:'absolute', left:0, right:0, bottom:36, height:80, zIndex:5} },
        e(AudioBars, { count: 48, height: 80, color: T.accent, speed: 1.6 })
      ),
      e(Ticker, { items: TICKER.brb })
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(e(SceneBRB));
})();
</script>
</body>
</html>
