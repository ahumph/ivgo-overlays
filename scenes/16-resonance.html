<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>IVGO · 16 Resonance</title>
<meta name="viewport" content="width=1920"/>
<style>
  html,body{margin:0;padding:0;background:transparent;width:1920px;height:1080px;overflow:hidden}

  @keyframes resonance-dot { 0%,100% { opacity:1; } 50% { opacity:.25; } }
  @keyframes resonance-bar { 0%,100% { height:20%; } 50% { height:100%; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="../phoenix.min.js"></script>
<script src="../ivgo-shared.js"></script>

<script>
(function () {
  const { T, bus } = window.IVGO;

  // !resonance (Ivgo.Twitch.Commands.Control) broadcasts control.resonance
  // with a duration_ms. This page owns everything about what that LOOKS and
  // SOUNDS like: it holds the only obs-websocket connection involved, so
  // ducking/boosting volume and (optionally) toggling a desaturate filter on
  // the game source both happen here, alongside the HUD. The chat command
  // itself never touches OBS directly - it just starts the clock.
  //
  // Reverts itself automatically once duration_ms elapses. If the OBS call
  // fails outright (wrong source name, OBS not running), the HUD still times
  // out on its own rather than getting stuck showing "active" forever.
  //
  // URL params:
  //   resonance_off=1       disable on this source
  //   obsws=ws://host:port  obs-websocket address (default ws://localhost:4455)
  //   obsws_pw=secret       obs-websocket password, if auth is enabled
  //   music_source=Music    input to boost (skipped if blank)
  //   duck_sources=Mic,SFX  comma-separated inputs to duck (skipped if blank)
  //   boost_db=6            dB added to the music source's current level
  //   duck_db=-18           dB added (i.e. subtracted) to each ducked source
  //   filter_source=Game    source holding a pre-made, disabled-by-default
  //   filter_name=Resonance Look
  //                         visual filter (e.g. Color Correction) to enable
  //                         for the duration - the streamer creates this once
  //                         in OBS; both params must be set to use it

  const P = new URLSearchParams(location.search);
  if (P.get('resonance_off') === '1') return;

  const WS_URL       = P.get('obsws') || 'ws://localhost:4455';
  const PASSWORD     = P.get('obsws_pw') || '';
  const MUSIC_SOURCE = (P.get('music_source') || '').trim();
  const DUCK_SOURCES = (P.get('duck_sources') || '').split(',').map(s => s.trim()).filter(Boolean);
  const BOOST_DB     = parseFloat(P.get('boost_db') || '6');
  const DUCK_DB      = parseFloat(P.get('duck_db') || '-18');
  const FILTER_SOURCE = (P.get('filter_source') || '').trim();
  const FILTER_NAME   = (P.get('filter_name') || '').trim();
  const RECONNECT_MS  = 5000;

  // ── HUD ───────────────────────────────────────────────────────────────
  const root = document.getElementById('root');
  root.style.cssText = 'position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 500ms ease';

  root.innerHTML = [
    '<div style="position:absolute;inset:0;background:radial-gradient(ellipse at center, rgba(0,0,0,0) 42%, rgba(0,0,0,.55) 100%)"></div>',
    // top:64px = the 54px header chrome (HeaderBar in ivgo-shared.js) + 10px
    // clear of it, so this never overlaps the header on scenes that have one.
    '<div style="position:absolute;top:64px;left:24px;display:flex;align-items:center;gap:8px;',
      'padding:8px 14px;background:rgba(6,8,10,.88);border:1px solid rgba(255,90,60,.5);',
      'font-family:' + T.mono + ';font-size:12px;letter-spacing:.14em;color:#fff;text-transform:uppercase">',
      '<span style="width:7px;height:7px;border-radius:50%;background:' + T.live + ';animation:resonance-dot 1.1s ease-in-out infinite"></span>',
      'Resonance active',
    '</div>',
    '<div id="resonance-bars" style="position:absolute;bottom:26px;left:50%;transform:translateX(-50%);',
      'display:flex;align-items:flex-end;gap:4px;height:56px"></div>'
  ].join('');

  const barsEl = document.getElementById('resonance-bars');
  for (let i = 0; i < 20; i++) {
    const bar = document.createElement('i');
    bar.style.cssText = [
      'display:block', 'width:5px', 'border-radius:2px',
      'background:linear-gradient(180deg,#ff8a72,' + T.live + ')',
      'animation:resonance-bar ' + (700 + Math.random() * 500).toFixed(0) + 'ms ease-in-out infinite',
      'animation-delay:' + (Math.random() * 0.9).toFixed(2) + 's'
    ].join(';');
    barsEl.appendChild(bar);
  }

  function showHud() { root.style.opacity = '1'; }
  function hideHud() { root.style.opacity = '0'; }

  // ── obs-websocket (v5) ────────────────────────────────────────────────
  // Same wire protocol MicMuteIndicator already speaks (see that section of
  // this file), extended here into a proper request/response map since
  // reading-then-restoring a volume needs to correlate a response to the
  // specific call that asked for it, not just react to the next message in.
  let ws = null;
  let identified = false;
  let reconnectTimer = null;
  const pending = {};
  let reqCounter = 0;

  function send(op, d) {
    if (!ws || ws.readyState !== 1) return;
    ws.send(JSON.stringify({ op: op, d: d }));
  }

  function request(requestType, requestData) {
    return new Promise((resolve, reject) => {
      if (!identified) { reject(new Error('obs-websocket not connected')); return; }
      const requestId = 'ivgo-resonance-' + (++reqCounter);
      pending[requestId] = resolve;
      send(6, { requestType: requestType, requestId: requestId, requestData: requestData });
      setTimeout(() => {
        if (pending[requestId]) {
          delete pending[requestId];
          reject(new Error('obs-websocket request timed out: ' + requestType));
        }
      }, 4000);
    });
  }

  async function computeAuth(password, salt, challenge) {
    const enc = new TextEncoder();
    async function sha256b64(str) {
      const buf = await crypto.subtle.digest('SHA-256', enc.encode(str));
      let bin = '';
      const bytes = new Uint8Array(buf);
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin);
    }
    const secret = await sha256b64(password + salt);
    return await sha256b64(secret + challenge);
  }

  async function onMessage(ev) {
    let msg;
    try { msg = JSON.parse(ev.data); } catch (e) { return; }
    const op = msg.op, d = msg.d;

    if (op === 0) {
      // Hello -> Identify. eventSubscriptions=0: this page only makes
      // request/response calls, it does not need to hear any OBS events.
      const identify = { rpcVersion: 1, eventSubscriptions: 0 };
      if (d.authentication && PASSWORD) {
        identify.authentication = await computeAuth(PASSWORD, d.authentication.salt, d.authentication.challenge);
      }
      send(1, identify);
    } else if (op === 2) {
      identified = true;
    } else if (op === 7) {
      const resolve = pending[d.requestId];
      if (resolve) {
        delete pending[d.requestId];
        resolve(d.responseData || {});
      }
    }
  }

  function connect() {
    try {
      ws = new WebSocket(WS_URL);
    } catch (e) {
      scheduleReconnect();
      return;
    }
    ws.addEventListener('message', onMessage);
    ws.addEventListener('close', () => { identified = false; scheduleReconnect(); });
    ws.addEventListener('error', () => { try { ws.close(); } catch (_) {} });
  }

  function scheduleReconnect() {
    if (reconnectTimer) return;
    reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, RECONNECT_MS);
  }

  connect();

  // ── Resonance sequence ──────────────────────────────────────────────────
  const AUDIO_SOURCES = Array.from(new Set([MUSIC_SOURCE, ...DUCK_SOURCES].filter(Boolean)));

  async function readVolumes() {
    const originals = {};
    for (const name of AUDIO_SOURCES) {
      try {
        const resp = await request('GetInputVolume', { inputName: name });
        originals[name] = resp.inputVolumeDb;
      } catch (e) {
        console.warn('[IVGO resonance] could not read volume for ' + name, e);
      }
    }
    return originals;
  }

  async function applyVolumes(originals) {
    if (MUSIC_SOURCE && originals[MUSIC_SOURCE] != null) {
      await request('SetInputVolume', {
        inputName: MUSIC_SOURCE,
        inputVolumeDb: originals[MUSIC_SOURCE] + BOOST_DB
      }).catch(e => console.warn('[IVGO resonance] boost failed', e));
    }
    for (const name of DUCK_SOURCES) {
      if (originals[name] == null) continue;
      await request('SetInputVolume', {
        inputName: name,
        inputVolumeDb: originals[name] + DUCK_DB
      }).catch(e => console.warn('[IVGO resonance] duck failed for ' + name, e));
    }
  }

  async function restoreVolumes(originals) {
    for (const name of Object.keys(originals)) {
      await request('SetInputVolume', { inputName: name, inputVolumeDb: originals[name] })
        .catch(e => console.warn('[IVGO resonance] restore failed for ' + name, e));
    }
  }

  function setFilterEnabled(enabled) {
    if (!FILTER_SOURCE || !FILTER_NAME) return Promise.resolve();
    return request('SetSourceFilterEnabled', {
      sourceName: FILTER_SOURCE,
      filterName: FILTER_NAME,
      filterEnabled: enabled
    }).catch(e => console.warn('[IVGO resonance] filter toggle failed', e));
  }

  async function runResonance(durationMs) {
    showHud();
    const originals = await readVolumes();
    await applyVolumes(originals);
    await setFilterEnabled(true);

    setTimeout(async () => {
      hideHud();
      await restoreVolumes(originals);
      await setFilterEnabled(false);
    }, durationMs);
  }

  bus.on('control.resonance', (p) => {
    const durationMs = (p && p.duration_ms) || 45000;
    runResonance(durationMs);
  });
})();
</script>
</body>
</html>
